default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "root") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "123456") %>

  socket: /var/run/mysqld/mysqld.sock

development:
  <<: *default
  database: job_crawler_development

test:
  <<: *default
  database: job_crawler_test

production:
  primary: &primary_production
    <<: *default
    database: job_crawler_production
    username: job_crawler
    password: <%= ENV["JOB_CRAWLER_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: job_crawler_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: job_crawler_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: job_crawler_production_cable
    migrations_paths: db/cable_migrate
